services:
  nexotex:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${NEXOTEX_PORT:-8000}:8000"
    volumes:
      - ./workspace:/workspace
      - nexotex-data:/data
    environment:
      NEXOTEX_COMPILE_TIMEOUT: ${NEXOTEX_COMPILE_TIMEOUT:-120}
    init: true
    restart: unless-stopped
    pids_limit: 160
    mem_limit: 2g
    cpus: 2
    # Bubblewrap needs user namespaces; Docker's default seccomp blocks unshare.
    # Its inner sandbox drops network and hides application/metadata files.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  nexotex-data:
